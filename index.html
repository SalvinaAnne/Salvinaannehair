<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Salvina Anne Hair Extensions — Luxury. Glam. Confidence. Premium Weft, Tape and Butterfly Weft hair extensions in Melbourne.">
<title>Salvina Anne Hair Extensions | Luxury. Glam. Confidence.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Parisienne&display=swap');

:root{
  --black:#050505;
  --black-soft:#0b0a0a;
  --panel:#11100f;
  --gold:#c9a15a;
  --gold-light:#ecd39d;
  --rose:#b88b8d;
  --ivory:#f5eee3;
  --muted:#b9afa2;
  --line:rgba(201,161,90,.26);
  --line-soft:rgba(245,238,227,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--ivory);font-family:Montserrat,Arial,sans-serif;font-weight:300;line-height:1.7}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#000}

.container{width:min(1180px,calc(100% - 44px));margin:auto}
.kicker{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--rose);font-weight:500}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.script{font-family:Parisienne,cursive}

header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,rgba(5,5,5,.96),rgba(5,5,5,.72),transparent);
  transition:.3s;
}
.nav{height:98px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo-nav{width:142px;height:78px;object-fit:contain;mix-blend-mode:normal;filter:drop-shadow(0 0 10px rgba(201,161,90,.18))}
nav{display:flex;align-items:center;gap:30px}
nav a{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:#eee}
nav a:hover{color:var(--gold-light)}

.hero{
  min-height:78svh;position:relative;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(ellipse at 75% 42%,rgba(201,161,90,.16),transparent 28%),
    radial-gradient(ellipse at 20% 75%,rgba(184,139,141,.10),transparent 28%),
    #050505;
}
.hero:before{
  content:"";position:absolute;inset:0;opacity:.38;
  background:
    linear-gradient(115deg,transparent 0 30%,rgba(201,161,90,.08) 31%,transparent 34%),
    linear-gradient(70deg,transparent 0 62%,rgba(255,255,255,.03) 63%,transparent 66%);
}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:35px;padding-top:70px;padding-bottom:38px}
.hero-copy{padding:20px 0;max-width:650px}
.hero .kicker{margin-bottom:18px}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(58px,7.4vw,102px);line-height:.82;margin:0 0 30px;letter-spacing:-2px}
.hero h1 em{font-style:italic;color:var(--gold-light)}
.hero-sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;color:#ddd2c4;max-width:610px;line-height:1.45}
.hero-motto{margin:26px 0 0;font-size:11px;letter-spacing:5px;color:var(--rose);text-transform:uppercase}
.hero-logo-wrap{position:relative;display:grid;place-items:center;min-height:360px}
.hero-logo-glow{position:absolute;width:390px;height:390px;border-radius:50%;background:rgba(201,161,90,.11);filter:blur(70px)}
.hero-logo{position:relative;width:min(430px,100%);mix-blend-mode:normal;filter:drop-shadow(0 0 28px rgba(201,161,90,.24))}
.gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto;width:min(760px,85%)}

section{padding:92px 0;position:relative}
.section-head{max-width:780px;margin-bottom:55px}
.section-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(48px,5.5vw,72px);font-weight:400;line-height:.95;margin:10px 0 22px}
.section-head p{color:var(--muted);font-size:15px;line-height:1.9}
.dark-band{background:linear-gradient(180deg,#080707,#050505)}
.gold-wash{background:radial-gradient(ellipse at 50% 0,rgba(201,161,90,.08),transparent 40%)}

.about-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:75px;align-items:center}
.about-copy{font-size:15px;color:#d0c6b9}
.about-copy p{margin:0 0 20px}
.about-image{border:1px solid var(--line);padding:7px;background:#090909}
.about-image img{width:100%;aspect-ratio:4/5;object-fit:cover}

.quote{
  margin:35px 0;padding:28px 0 28px 28px;border-left:1px solid var(--gold);
  font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;line-height:1.25;color:var(--gold-light)
}

.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.service-card{background:linear-gradient(145deg,#131110,#080808);border:1px solid var(--line);overflow:hidden;transition:.35s}
.service-card:hover{transform:translateY(-6px);border-color:rgba(236,211,157,.65)}
.service-photo{height:390px;overflow:hidden}
.service-photo img{width:100%;height:100%;object-fit:cover;transition:.5s}
.service-card:hover .service-photo img{transform:scale(1.035)}
.service-body{padding:25px 22px 28px}
.service-body .num{font-size:9px;letter-spacing:3px;color:var(--rose)}
.service-body h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:31px;font-weight:500;margin:8px 0 10px;color:var(--gold-light)}
.service-body p{font-size:12px;color:var(--muted);line-height:1.75;margin:0}

.feature-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center}
.feature-images{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feature-images img{width:100%;height:300px;object-fit:cover}
.feature-copy h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:58px;font-weight:400;line-height:.95;margin:12px 0 20px}
.feature-copy p{color:var(--muted);font-size:14px}
.feature-label{display:inline-block;border:1px solid var(--line);padding:8px 12px;font-size:9px;letter-spacing:2.5px;color:var(--gold-light);text-transform:uppercase}

.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.price-group{border:1px solid var(--line);background:#090909}
.price-group-head{padding:28px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(201,161,90,.09),transparent)}
.price-group-head h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;font-weight:400;color:var(--gold-light);margin:0}
.price-group-head p{margin:7px 0 0;color:var(--muted);font-size:12px}
.price-row{display:flex;justify-content:space-between;gap:20px;padding:18px 28px;border-bottom:1px solid var(--line-soft);font-size:13px}
.price-row:last-child{border-bottom:0}
.price-row span:last-child{color:var(--gold-light);white-space:nowrap}

.consult{margin-top:18px;border:1px solid var(--line);padding:35px;background:linear-gradient(135deg,rgba(201,161,90,.07),transparent)}
.consult h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;font-weight:400;margin:0 0 10px;color:var(--gold-light)}
.consult p{color:var(--muted);font-size:13px;max-width:880px}

.education{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:45px}
.edu-card{border:1px solid var(--line);padding:38px;background:#090909}
.edu-card .edu-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;color:var(--gold-light)}
.edu-card .edu-price{font-size:12px;letter-spacing:2px;color:var(--rose);margin-top:12px}

.transformations{background:#090808}
.work-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.work{overflow:hidden;border:1px solid rgba(255,255,255,.07);background:#111}
.work img{width:100%;height:100%;object-fit:cover;transition:.55s}
.work:hover img{transform:scale(1.025)}
.work:nth-child(1){grid-column:span 5;height:510px}
.work:nth-child(2){grid-column:span 7;height:510px}
.work:nth-child(3){grid-column:span 7;height:500px}
.work:nth-child(4){grid-column:span 5;height:500px}
.work:nth-child(5){grid-column:span 12;height:600px}

.meet-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:70px;align-items:center}
.meet-photo{border:1px solid var(--line);padding:7px;background:#080808}
.meet-photo img{width:100%;aspect-ratio:4/5;object-fit:cover}
.meet-copy h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:70px;font-weight:400;line-height:.9;margin:8px 0 25px}
.meet-copy h2 span{display:block;color:var(--gold-light);font-family:Parisienne,cursive;font-size:72px;margin-top:-4px}
.meet-copy p{font-size:14px;color:var(--muted);line-height:1.9}
.signature{font-family:Parisienne,cursive;font-size:42px;color:var(--gold-light);margin-top:24px}

.values{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:50px}
.value{padding:38px 30px;border:1px solid var(--line);background:linear-gradient(145deg,#12100f,#080808)}
.value .big{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;color:var(--gold-light)}
.value p{color:var(--muted);font-size:13px;line-height:1.75}

.policies-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.policy{border:1px solid var(--line);background:#090909;padding:32px}
.policy h3{font-size:12px;letter-spacing:2.4px;color:var(--gold-light);text-transform:uppercase;margin:0 0 18px}
.policy ul{padding:0;margin:0;list-style:none}
.policy li{font-size:12px;color:var(--muted);padding:9px 0 9px 19px;position:relative;border-bottom:1px solid var(--line-soft)}
.policy li:last-child{border-bottom:0}
.policy li:before{content:"";position:absolute;left:0;top:18px;width:5px;height:5px;border-radius:50%;background:var(--gold)}

.contact{background:
  radial-gradient(ellipse at 50% 20%,rgba(201,161,90,.13),transparent 35%),
  #050505;text-align:center}
.contact-box{border:1px solid var(--line);padding:75px 30px;position:relative}
.contact-box h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(48px,6vw,76px);font-weight:400;line-height:.95;margin:12px 0 18px}
.contact-box p{color:var(--muted);max-width:650px;margin:0 auto 35px}
.contact-links{display:flex;justify-content:center;gap:35px;flex-wrap:wrap}
.contact-links a{font-size:11px;letter-spacing:1.7px;color:var(--gold-light);border-bottom:1px solid var(--line);padding-bottom:6px}
.location{margin-top:28px;color:#81786e;font-size:10px;letter-spacing:2px;text-transform:uppercase}

footer{padding:42px 0;border-top:1px solid var(--line);text-align:center}
footer img{width:135px;height:72px;object-fit:contain;margin:0 auto 18px;mix-blend-mode:screen}
footer p{font-size:9px;letter-spacing:2.5px;color:#766f66;text-transform:uppercase;margin:0}

@media(max-width:980px){
  nav{gap:16px}
  .hero-inner,.about-grid,.feature-grid,.meet-grid{grid-template-columns:1fr}
  .hero-logo-wrap{min-height:380px;order:-1}
  .service-grid{grid-template-columns:1fr 1fr}
  .about-grid{gap:35px}
  .pricing-grid,.policies-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
  .container{width:min(100% - 30px,1180px)}
  header{background:rgba(5,5,5,.96)}
  .nav{height:76px}
  .logo-nav{width:112px;height:62px}
  nav{gap:11px}
  nav a{font-size:8px;letter-spacing:1.1px}
  nav a:nth-child(2),nav a:nth-child(3){display:none}
  section{padding:68px 0}
  .hero-inner{padding-top:78px;padding-bottom:24px}
  .hero h1{font-size:58px}
  .hero-sub{font-size:20px}
  .hero-logo-wrap{min-height:230px;margin-top:-8px}
  .hero-logo{max-width:310px}
  .service-grid{grid-template-columns:1fr}
  .service-photo{height:430px}
  .feature-images{grid-template-columns:1fr}
  .feature-images img{height:390px}
  .pricing-grid,.education{grid-template-columns:1fr}
  .work-grid{grid-template-columns:1fr}
  .work:nth-child(n){grid-column:span 1;height:430px}
  .meet-copy h2{font-size:58px}
  .meet-copy h2 span{font-size:64px}
  .values{grid-template-columns:1fr}
  .contact-links{gap:18px;flex-direction:column}
}
</style>
</head>
