  --gold-light:#f0d59a;
  --rose:#d49a9f;
  --ivory:#f7f0e8;
  --grey:#bdb5ad;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  scroll-behavior:smooth;
}

body {
  background:var(--black);

.container {

/* NAVIGATION */

nav {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:rgba(5,5,5,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(215,173,98,.25);
}

.nav-inner {
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.nav-logo {
  width:125px;
}

.nav-links {
  display:flex;
  gap:30px;
  align-items:center;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.nav-links a {
  transition:.3s;
}

.nav-links a:hover {
  color:var(--rose);
}

    ),

      rgba(215,173,98,.10),
      transparent 35%
    ),
    var(--black);
}

.hero-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:55px;
}

.motto {
  color:var(--rose);
  text-transform:uppercase;
  letter-spacing:4px;
  font-size:12px;
  margin-bottom:20px;
}
